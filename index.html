  <!-- ONE store H5 SDK (required for ONE store listing). Outside the ONE store app it resolves with err; if it fails to load, the game module still runs on its own -->
  <!-- classic script so Vite leaves it in the HTML and it starts before the game module -->
  <script>
    import("https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js").then(({ createSDK }) => {
      const sdk = createSDK();
      // lifecycle -> game (main.ts host:* listeners); exit = pause too, progress is already saved on every change
      sdk.on("pause", () => dispatchEvent(new Event("host:pause")));
      sdk.on("resume", () => dispatchEvent(new Event("host:resume")));
      sdk.onClose(() => dispatchEvent(new Event("host:pause")));
      return sdk.initializeAsync().then((info) => {
        if (info.err) return;
        sdk.setLoadingProgress(100);
        return sdk.startGameAsync();
      });
    }).catch((e) => console.warn("onestore sdk", e));
  </script>
